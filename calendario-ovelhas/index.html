<title>Lã-boratório das Ovelhas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: caderno de laboratório em papel quadriculado; cabeçalho ilustrado com o lab de cada ovelha nas pontas, calendário + coluna lateral abaixo */
:root{
  --paper:#2F5244; --board-hi:#3A6352; --board-lo:#274537; --on-board:#F5F2E8; --on-board-soft:#D3E2D8;
  --card:#FFFFFF; --card-2:#F3F6F2;
  --ink:#24372F; --ink-soft:#5F7369; --line:#E0E8E1;
  --ela:#EE5F95; --ela-soft:#FFE3EE; --ele:#3F82D6; --ele-soft:#DDEBFF; --juntos:#8E6CD8; --juntos-soft:#EEE6FF;
  --gold:#F2A93B; --gold-soft:#FFF1D6; --br:#239A5A; --br-soft:#E1F6E8; --jew:#3A66CF; --jew-soft:#E3EBFF;
  --sky:#EAF1FF; --sky-2:#F7EEFF; --hill:#CDEFD6; --hill-2:#B5E5C3;
  --shadow:0 1px 0 rgba(46,42,74,.04),0 8px 24px -12px rgba(70,50,130,.25);
  --f-display:"Grandstander","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1C3128; --board-hi:#244033; --board-lo:#16271F; --on-board:#EEF2EA; --on-board-soft:#A9C2B4;
  --card:#22302B; --card-2:#2A3A34;
  --ink:#EEF4EF; --ink-soft:#A8BDB2; --line:#39504A;
  --ela:#FF85B1; --ela-soft:#4A2440; --ele:#7DB2FF; --ele-soft:#1F3157; --juntos:#B79CFF; --juntos-soft:#352B5E;
  --gold:#FFC266; --gold-soft:#3E3020; --br:#5BD18F; --br-soft:#1E3B2E; --jew:#8EAEFF; --jew-soft:#232E55;
  --sky:#232650; --sky-2:#2D2457; --hill:#2F5A4B; --hill-2:#27503F;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1C3128; --board-hi:#244033; --board-lo:#16271F; --on-board:#EEF2EA; --on-board-soft:#A9C2B4;
  --card:#22302B; --card-2:#2A3A34;
  --ink:#EEF4EF; --ink-soft:#A8BDB2; --line:#39504A;
  --ela:#FF85B1; --ela-soft:#4A2440; --ele:#7DB2FF; --ele-soft:#1F3157; --juntos:#B79CFF; --juntos-soft:#352B5E;
  --gold:#FFC266; --gold-soft:#3E3020; --br:#5BD18F; --br-soft:#1E3B2E; --jew:#8EAEFF; --jew-soft:#232E55;
  --sky:#232650; --sky-2:#2D2457; --hill:#2F5A4B; --hill-2:#27503F;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--paper)}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 80% at 50% 0%,var(--board-hi),var(--paper) 55%,var(--board-lo) 100%);
  background-attachment:fixed;background-repeat:no-repeat;}
.chalk{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.top h1,.brand small,.shop-head h2,.shop-head .eyebrow,.shop-head .muted{color:var(--on-board)}
.brand small,.shop-head .eyebrow,.shop-head .muted{color:var(--on-board-soft)}
.top h1{font-family:var(--f-display)}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(26px,4.2vw,40px);font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--juntos);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}

/* ---------- topo ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-soft);font-weight:600}
.tabs{display:flex;gap:6px;background:var(--card);border:1.5px solid var(--line);padding:5px;border-radius:999px;box-shadow:var(--shadow);flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{background:var(--juntos-soft);color:var(--ink)}
.status{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.status.live i{background:var(--br)}

/* ---------- herói ---------- */
.hero{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,var(--sky),var(--sky-2));border:1.5px solid var(--line);box-shadow:var(--shadow)}
.hero svg.scene{display:block;width:100%;height:auto}
.hero .hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--ink-soft);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;opacity:.85;pointer-events:none}
.hero .labels{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 14px;margin-top:-6px}
.lab-tag{display:flex;flex-direction:column;gap:2px;min-width:0}
.lab-tag b{font-family:var(--f-display);font-size:17px}
.lab-tag span{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.lab-tag.ele{text-align:right;align-items:flex-end}
.lab-tag.ela b{color:var(--ela)} .lab-tag.ele b{color:var(--ele)}
.bubble{position:absolute;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:700;font-size:13.5px;max-width:240px;box-shadow:var(--shadow);transform:translate(-50%,-100%);pointer-events:none;animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{transform:translate(-50%,-90%) scale(.8);opacity:0}}
.sheep-hit{cursor:pointer}
.sheep-hit:hover .bob,.sheep-hit:focus .bob{animation:wiggle .6s ease-in-out}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.float{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
.blink{animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- shabat ---------- */
.shabat{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:22px;background:linear-gradient(90deg,var(--gold-soft),var(--jew-soft));border:1.5px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
.shabat svg{flex:none}
.shabat .scene-mini{width:min(240px,100%);border-radius:16px;overflow:hidden;margin-left:auto}
.shabat .scene-mini svg{display:block;width:100%;height:auto}
.shabat h2{font-size:clamp(24px,3.4vw,32px);color:var(--ink)}
.shabat p{margin:2px 0 0;color:var(--ink-soft);font-weight:600}
.flame{transform-origin:50% 90%;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(.88,1.08) rotate(3deg)}}

/* ---------- grade principal ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cal{padding:16px;display:grid;gap:12px;min-width:0}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav h2{min-width:190px;text-align:center;font-size:24px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);display:grid;place-items:center}
.iconbtn:hover{background:var(--juntos-soft)}
.iconbtn svg{width:18px;height:18px}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:800;background:var(--card-2);border:1.5px solid var(--line)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--juntos);color:#fff;border-color:transparent}
.btn.ela{background:var(--ela);color:#fff;border-color:transparent}
.btn.danger{background:transparent;color:var(--ela);border-color:var(--ela)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px 5px 6px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip svg{width:22px;height:22px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend .chip{padding:4px 10px 4px 5px;font-size:12.5px}
.ticon{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:var(--c);color:var(--t)}
.ticon svg{width:13px;height:13px}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);text-align:center;padding-bottom:2px}
.dow.sat{color:var(--jew)}
.day{position:relative;min-height:112px;border-radius:14px;background:var(--card-2);border:1.5px solid transparent;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.day:hover{border-color:var(--line)}
.day.out{opacity:.42}
.day.sel{border-color:var(--juntos);background:var(--juntos-soft)}
.day.today .num{background:var(--ela);color:#fff}
.day.holiday{background:linear-gradient(180deg,var(--br-soft),var(--card-2) 70%)}
.day.jholiday{background:linear-gradient(180deg,var(--jew-soft),var(--card-2) 70%)}
.day .top-row{display:flex;align-items:center;justify-content:space-between;gap:4px}
.num{font-family:var(--f-display);font-weight:700;font-size:15px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.candle-mini{display:flex;align-items:center;gap:2px;font-size:10.5px;color:var(--gold);font-family:var(--f-mono)}
.candle-mini svg{width:12px;height:14px}
.hol{font-size:10.5px;font-weight:800;line-height:1.2;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hol.br{background:var(--br);color:#fff}
.hol.sp{background:transparent;color:var(--br);border:1px dashed var(--br)}
.hol.jew{background:var(--jew);color:#fff}
.hol.jew.minor{background:transparent;color:var(--jew);border:1px dashed var(--jew)}
.hol.love{background:var(--ela);color:#fff}
.ev{display:flex;align-items:center;gap:4px;border:0;border-radius:7px;padding:2px 5px;background:var(--c);color:var(--t);font-size:11.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:left}
.ev .who{flex:none;width:8px;height:8px;border-radius:50%;background:var(--w);box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev .tm{font-family:var(--f-mono);font-weight:500;opacity:.85}
@media (max-width:1180px){.ev .tm{display:none}}
.more{font-size:11px;font-weight:800;color:var(--ink-soft);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.sticker{position:absolute;right:2px;bottom:0;width:34px;height:34px;opacity:.9;pointer-events:none}

/* ---------- lateral ---------- */
.side{display:grid;gap:18px;min-width:0}
.side .panel{padding:16px;display:grid;gap:12px;min-width:0}
.day-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.heb{font-size:12.5px;color:var(--jew);font-weight:700}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--card-2);border:1.5px solid transparent;text-align:left;width:100%;min-width:0}
button.item:hover{border-color:var(--line)}
.item .meta{min-width:0;display:grid}
.item .meta b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta small{color:var(--ink-soft);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tag{margin-left:auto;flex:none}
.mini-sheep{width:34px;height:34px;flex:none}
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:10px 6px;color:var(--ink-soft);font-weight:600;font-size:14px}
.empty svg{width:120px;height:auto}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.time-box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 10px}
.time-box b{font-family:var(--f-mono);font-size:20px;font-weight:500;display:block}
.time-box small{font-size:12px;color:var(--ink-soft);font-weight:700}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,24,60,.42);display:grid;place-items:center;z-index:50;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));backdrop-filter:blur(2px)}
.modal{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:24px;border:1.5px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);padding:20px;display:grid;gap:14px;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.modal-art{border-radius:16px;overflow:hidden}
.modal-art svg{display:block;width:100%;height:auto}
.modal-head{display:flex;align-items:center;gap:12px}
.modal-head svg{width:56px;height:56px;flex:none}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-size:12.5px;font-weight:800;color:var(--ink-soft);letter-spacing:.03em}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card-2);border-radius:12px;padding:9px 11px;min-width:0}
.inp:focus{outline:none;border-color:var(--juntos)}
textarea.inp{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.who-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.who-opt{border:2px solid var(--line);background:var(--card-2);border-radius:16px;padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;font-weight:800;font-size:13px}
.who-opt svg{width:56px;height:52px}
.who-opt[aria-checked="true"]{border-color:var(--c);background:var(--cs)}
.type-pick{display:flex;flex-wrap:wrap;gap:6px}
.type-opt{border:2px solid var(--line);background:var(--card-2);border-radius:999px;padding:4px 10px 4px 4px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.type-opt[aria-checked="true"]{border-color:var(--c);background:var(--card)}
.check{display:flex;align-items:center;gap:8px;font-weight:700}
.check input{width:18px;height:18px;accent-color:var(--juntos)}
.modal-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.modal-foot .grow{flex:1}
.confirm{background:var(--ela-soft);border-radius:14px;padding:10px 12px;display:grid;gap:8px;font-weight:700}
.confirm div{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- compras ---------- */
.shop{display:grid;gap:18px}
.shop-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cat{border:1.5px solid var(--line);background:var(--card);border-radius:20px;overflow:hidden;padding:0;text-align:left;box-shadow:var(--shadow);display:grid;transition:transform .15s}
.cat:hover{transform:translateY(-3px)}
.cat[aria-pressed="true"]{outline:3px solid var(--juntos);outline-offset:2px}
.cat svg{display:block;width:100%;height:auto}
.cat .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 11px}
.cat .cap b{font-family:var(--f-display);font-size:16px}
.count{font-family:var(--f-mono);font-size:12.5px;background:var(--card-2);border-radius:999px;padding:2px 9px;color:var(--ink-soft);white-space:nowrap}
.count.has{background:var(--juntos);color:#fff}
.cat-detail{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:0;overflow:hidden}
.cat-detail .art{background:var(--card-2)}
.cat-detail .art svg{display:block;width:100%;height:auto}
.cat-detail .body{padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.add-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto auto;gap:8px}
.mine{display:flex;gap:4px}
.mine button{border:1.5px solid var(--line);background:var(--card-2);border-radius:10px;padding:0 8px;height:100%;min-height:40px}
.mine button svg{width:30px;height:28px;display:block}
.mine button[aria-checked="true"]{border-color:var(--c);background:var(--cs)}
.sitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--card-2)}
.sitem input[type=checkbox]{width:22px;height:22px;accent-color:var(--juntos);flex:none}
.sitem .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.sitem.done .nm{text-decoration:line-through;color:var(--ink-soft)}
.sitem .qty{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-soft);margin-left:auto;white-space:nowrap}
.sitem .x{border:0;background:transparent;color:var(--ink-soft);width:28px;height:28px;border-radius:8px;flex:none}
.sitem .x:hover{background:var(--ela-soft);color:var(--ela)}
.sitem svg.ws{width:26px;height:24px;flex:none}

/* ---------- wishlist ---------- */
.wish{display:grid;gap:18px}
.wish-top{overflow:hidden;position:relative}
.wish-top svg{display:block;width:100%;height:auto}
.wish-top .ttl{position:absolute;left:clamp(14px,3vw,28px);bottom:clamp(10px,2.4vw,22px);display:grid;gap:2px;max-width:46%}
.wish-top .ttl h2{font-size:clamp(20px,3.4vw,34px);color:#2E2A4A}
.wish-top .ttl span{color:#6E6890;font-weight:700;font-size:13px}
.wish-body{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.wish-form{padding:16px;display:grid;gap:10px}
.wish-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;min-width:0}
.wcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;box-shadow:var(--shadow);align-content:start;min-width:0}
.wcard h3{overflow-wrap:anywhere}
.wcard .price{font-family:var(--f-mono);font-size:14px;color:var(--ink-soft)}
.wcard p{margin:0;font-size:13.5px;color:var(--ink-soft);overflow-wrap:anywhere}
.wcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.wcard a.btn{text-decoration:none;color:var(--ink)}
.wcard.got{opacity:.7}
.wcard.got h3{text-decoration:line-through}
.hearts{display:flex;gap:2px;color:var(--ela)}
.hearts svg{width:16px;height:16px}
.hearts .off{opacity:.25}
.prio-pick{display:flex;gap:6px}
.prio-pick button{border:2px solid var(--line);background:var(--card-2);border-radius:12px;padding:5px 9px;display:flex;gap:1px;color:var(--ela)}
.prio-pick button svg{width:15px;height:15px}
.prio-pick button[aria-checked="true"]{border-color:var(--ela);background:var(--ela-soft)}

<script>
/* =========================================================

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const DOW_FULL = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch{ return d; } },
             set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };

/* =========================================================
   Feriados brasileiros (nacionais + SP) e judaicos
   ========================================================= */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
const brCache = {};
function brHolidays(y){
  if (brCache[y]) return brCache[y];
  const out = {}; const put = (d,name,kind='br') => { const k = typeof d==='string'? `${y}-${d}` : iso(d); (out[k] ||= []).push({name,kind}); };
  put('01-01','Confraternização Universal'); put('04-21','Tiradentes'); put('05-01','Dia do Trabalho');
  put('09-07','Independência do Brasil'); put('10-12','Nossa Senhora Aparecida'); put('11-02','Finados');
  put('11-15','Proclamação da República'); put('11-20','Dia da Consciência Negra'); put('12-25','Natal');
  const e = easter(y);
  put(addDays(e,-48),'Carnaval','sp'); put(addDays(e,-47),'Carnaval','sp');
  put(addDays(e,-2),'Sexta-feira Santa'); put(e,'Páscoa','sp'); put(addDays(e,60),'Corpus Christi','sp');
  put('01-25','Aniversário de São Paulo','sp'); put('07-09','Revolução Constitucionalista (SP)','sp');
  put('06-12','Dia dos Namorados','love');
  return brCache[y] = out;
}
const hebFmt = new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const hebPt = new Intl.DateTimeFormat('pt-BR-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const hebCache = new Map();
function heb(d){
  const k = iso(d); if (hebCache.has(k)) return hebCache.get(k);
  const p = hebFmt.formatToParts(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)));
  const r = { day:+p.find(x=>x.type==='day').value, month:p.find(x=>x.type==='month').value, year:+(p.find(x=>x.type==='year')||{}).value };
  hebCache.set(k,r); return r;
}
function hebLabel(d){ return hebPt.format(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12))).replace(/\s*AM$/,''); }
function jewishBase(d){
  const {day,month} = heb(d), w = d.getDay(), out = [];
  const add = (name,minor=false) => out.push({name,kind:'jew',minor});
  const isAdar = month==='Adar' || month==='Adar II';
  if (month==='Tishri'){
    if (day===1||day===2) add(`Rosh Hashaná · ${day}º dia`);
    if (day===10) add('Yom Kipur');
    if (day===15||day===16) add(`Sucot · ${day-14}º dia`);
    if (day>=17&&day<=20) add('Chol HaMoed Sucot',true);
    if (day===21) add('Hoshaná Rabá',true);
    if (day===22) add('Shemini Atzeret');
    if (day===23) add('Simchat Torá');
  }
  // Chanucá: 25 de Kislev + 7 dias
  for (let k=0;k<8;k++){ const b = heb(addDays(d,-k)); if (b.month==='Kislev' && b.day===25){ add(`Chanucá · ${k+1}ª vela`, k>0); break; } }
  if (month==='Shevat' && day===15) add('Tu BiShvat',true);
  if (isAdar && day===14) add('Purim');
  if (month==='Nisan'){
    if (day===15||day===16) add(`Pessach · ${day-14}º dia`);
    if (day>=17&&day<=20) add('Chol HaMoed Pessach',true);
    if (day===21||day===22) add(`Pessach · ${day-14}º dia`);
    const ys = (day===27 && w!==5 && w!==0) || (day===26 && w===4) || (day===28 && w===1);
    if (ys) add('Yom HaShoá',true);
  }
  if (month==='Iyar'){
    const ya = (day===5 && w!==1 && w!==5 && w!==6) || ((day===4 || day===3) && w===4) || (day===6 && w===2);
    if (ya) add("Yom Ha'Atzmaut",true);
    if (day===18) add('Lag BaOmer',true);
  }
  if (month==='Sivan' && (day===6||day===7)) add(`Shavuot · ${day-5}º dia`);
  if (month==='Av'){
    if ((day===9 && w!==6) || (day===10 && w===0)) add("Tishá BeAv",true);
    if (day===15) out.push({name:'Tu BeAv · dia do amor',kind:'love'});
  }
  return out;
}
const MAJOR_EREV = [/^Rosh/,/^Yom Kipur/,/^Sucot · 1/,/^Pessach · 1/,/^Shavuot · 1/,/^Shemini/,/^Pessach · 7/];
function holidaysFor(d){
  const k = iso(d); const list = [...(brHolidays(d.getFullYear())[k]||[]), ...jewishBase(d)];
  const base = h => h.name.split(' ·')[0];
  const tom = jewishBase(addDays(d,1)).find(h => MAJOR_EREV.some(r=>r.test(h.name)));
  if (tom && !jewishBase(d).some(h => base(h)===base(tom)))
    list.push({name:`Erev ${/^Pessach · 7/.test(tom.name)?'últimos dias de Pessach':base(tom)} · ao pôr do sol`,kind:'jew',minor:true});
  return list;
}

function cloudPath(cx,cy,rx,ry,n,k=.58,rot=-Math.PI/2){
  const P=[]; for(let i=0;i<n;i++){const t=rot+i/n*2*Math.PI; P.push([cx+rx*Math.cos(t), cy+ry*Math.sin(t)]);}
  let d=`M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for(let i=0;i<n;i++){const [a,b]=P[i],[c,e]=P[(i+1)%n],r=(Math.hypot(c-a,e-b)*k).toFixed(1); d+=` A${r} ${r} 0 0 1 ${c.toFixed(1)} ${e.toFixed(1)}`;}
  return d+'Z';
}

function sheep({x=0,y=0,s=1,who='ela',mood='happy',wet=false,acc=[],flip=false,body=true,cls='bob'}={}){
  if (mood==='happy-closed') mood = 'closed';
  const baby = who==='ela', wool = wet ? 'url(#ov-wool-wet)' : 'url(#ov-wool)', edge = wet ? '#C4D8EA' : '#E4D4C0';
  const B = baby ? {cx:8,cy:6,rx:34,ry:24,legTop:16,legBot:42,head:[-27,-10],hs:1.18,tail:[42,-2]}
                 : {cx:10,cy:2,rx:42,ry:28,legTop:14,legBot:48,head:[-35,-14],hs:1,tail:[52,-8]};
  const coat = acc.includes('coat'), raise = false, match = acc.includes('match');
  const leg = (lx,far) => { const top=B.legTop, bot=B.legBot-(far?2:0);
    return `<path d="M${lx} ${top} h9 v${bot-top-4.5} a4.5 4.5 0 0 1 -9 0z" fill="url(#ov-leg${far?'-far':''})"/><path d="M${lx} ${bot-7} h9 v2.5 a4.5 4.5 0 0 1 -9 0z" fill="${far?'#6E5140':'#7E5E4A'}"/>`; };
  const fl = baby ? [-20,-7] : [-26,-12], bl = baby ? [16,28] : [22,36];
  let g = '';
  if (body){
    g += `<ellipse cx="${B.cx}" cy="${B.legBot+1}" rx="${B.rx+4}" ry="4.5" fill="url(#ov-shadow)"/>`;
    g += leg(bl[0]+4,true) + leg(fl[0]+4,true);

    if (coat){
      const {cx,cy,rx,ry} = B, L=cx-rx, R=cx+rx, T=cy-ry, H=cy+ry+2;
      g += woolBlob(B.tail[0],B.tail[1],7,7,6,wool,edge);
      g += `<path d="M${L+6} ${T+10} C${L+10} ${T-7} ${R-10} ${T-7} ${R-2} ${T+8} C${R+4} ${cy} ${R+5} ${H-6} ${R+3} ${H+1} Q${cx} ${H+8} ${L-3} ${H+1} C${L-5} ${H-8} ${L-3} ${T+22} ${L+6} ${T+10}Z" fill="url(#ov-coat)" stroke="#C6D1DF" stroke-width="1.3"/><path d="M${R-5} ${H-12} L${R-3} ${H+1}" stroke="#C6D1DF" stroke-width="1.4" stroke-linecap="round"/>`;

      g += `<path d="M${L+10} ${T+12} C${L+16} ${cy} ${L+15} ${H-10} ${L+13} ${H+3}" fill="none" stroke="#C6D1DF" stroke-width="1.5" stroke-linecap="round"/>`;
      g += `<path d="M${L+6} ${T+10} L${L+19} ${T+11} L${L+11} ${T+23}Z" fill="#FFFFFF" stroke="#C6D1DF" stroke-width="1.2" stroke-linejoin="round"/>`;

      g += `<path d="M${cx+8} ${cy+2} h13 v7 a3 3 0 0 1 -3 3 h-7 a3 3 0 0 1 -3 -3z" fill="#EAF0F7" stroke="#C6D1DF" stroke-width="1.1"/><rect x="${cx+11}" y="${cy-3}" width="2.3" height="6" rx="1.15" fill="#F06A9F"/><rect x="${cx+15.5}" y="${cy-2}" width="2.3" height="5" rx="1.15" fill="#5B8FE0"/>`;

  // cabeça de perfil
  const iris = baby ? '#3AA56A' : '#3A2A1F';

  h += `<path d="M-25.5 -1 q1.2 1.4 2.6 .8" fill="none" stroke="#9C7158" stroke-width="1.6" stroke-linecap="round"/>`;
  h += mood==='o' ? `<ellipse cx="-19" cy="7" rx="2.2" ry="2.6" fill="#7A4E3A"/>` : `<path d="M-22 6 q3.5 3 7.5 0" fill="none" stroke="#8A5A44" stroke-width="1.7" stroke-linecap="round"/>`;
  if (baby) h += `<g transform="translate(-6 -22) rotate(-16)"><path d="M-2 2 L-6 8 L-2.5 7.5 Z M2 2 L6 8 L2.5 7.5 Z" fill="#E2558F"/><path d="M0 0 C-3 -7 -13 -9 -13.5 -2 C-14 5 -5 5 0 0Z" fill="url(#ov-bow)"/><path d="M0 0 C3 -7 13 -9 13.5 -2 C14 5 5 5 0 0Z" fill="url(#ov-bow)"/><path d="M-9.5 -3 q2 -3 5 -2.4 M9.5 -3 q-2 -3 -5 -2.4" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".85"/><ellipse rx="3.4" ry="3.8" fill="#F0609B"/></g>`;
  if (acc.includes('kippah')) h += `<path d="M-6 -21 Q4 -32 14 -21 Z" fill="url(#ov-kippah)"/><path d="M-1 -24 q5 -3 10 0" stroke="#A9C4FF" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;

  if (match) h += `<path d="M-17 7 L-44 -8" stroke="#E2B776" stroke-width="2.4" stroke-linecap="round"/><circle cx="-44.5" cy="-8.3" r="2.3" fill="#C4421A"/><circle cx="-45" cy="-15" r="8" fill="url(#ov-glow)"/><path class="flame" d="M-45 -21 C-40.5 -15.5 -40.5 -12 -45 -10.3 C-49.5 -12 -49.5 -15.5 -45 -21Z" fill="#FFB429"/><path d="M-45 -16.5 C-43.3 -14.5 -43.3 -13 -45 -12 C-46.7 -13 -46.7 -14.5 -45 -16.5Z" fill="#FFF3C2"/>`;
  if (acc.includes('foam')) h += [[-6,-25,5.5],[4,-28,6.5],[13,-24,5]].map(([a,b,r])=>woolBlob(a,b,r,r,6,'#FFFFFF','#CFE2F2')).join('');
  if (wet) h += `<g fill="#86C7F0"><path d="M-30 -20 q3.5 6 0 8 q-3.5 -2 0 -8z"/><path d="M24 -24 q3.5 6 0 8 q-3.5 -2 0 -8z"/></g>`;
  const [hx,hy] = body ? B.head : [8,10];
  g += `<g transform="translate(${hx} ${hy}) scale(${B.hs})">${h}</g>`;
  return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})"><g class="${cls}" style="transform-box:fill-box;transform-origin:50% 100%">${g}</g></g>`;
}

const bubble = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(255,255,255,.45)" stroke="#A9D6F3" stroke-width="1.2"/><path d="M${x-r*.55} ${y-r*.15} a${r*.6} ${r*.6} 0 0 1 ${r*.45} ${-r*.42}" stroke="#fff" stroke-width="${Math.max(1,r*.18)}" fill="none" stroke-linecap="round"/>`;
const cloud = (x,y,s=1,c='#FFFFFF',o=1) => `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><path d="${cloudPath(0,0,34,13,9,.62)}" fill="${c}"/></g>`;
const shadow = (x,y,rx) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${Math.max(3,rx*.12)}" fill="url(#ov-shadow)"/>`;
const shine = d => `<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>`;
const trefoil = (x,y,s=1) => { const sec = a => { const r=Math.PI/180, a1=(a-30)*r, a2=(a+30)*r, P=(R,t)=>`${(R*Math.cos(t)).toFixed(2)} ${(R*Math.sin(t)).toFixed(2)}`;
  return `<path d="M${P(3.6,a1)} L${P(10,a1)} A10 10 0 0 1 ${P(10,a2)} L${P(3.6,a2)} A3.6 3.6 0 0 0 ${P(3.6,a1)}Z" fill="#33304A"/>`; };
  return `<g transform="translate(${x} ${y}) scale(${s})"><circle r="13" fill="#FFD449"/>${[-90,30,150].map(sec).join('')}<circle r="2.4" fill="#33304A"/></g>`; };
const box = (x,y,w,h,c,c2,rib) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${c}"/><rect x="${x}" y="${y}" width="${w}" height="${h*.28}" rx="4" fill="${c2}"/>${rib?`<rect x="${x+w/2-3.5}" y="${y}" width="7" height="${h}" fill="${rib}"/><path d="M${x+w/2} ${y} c-8 -11 -17 -5 -9 1z M${x+w/2} ${y} c8 -11 17 -5 9 1z" fill="${rib}"/>`:''}${shine(`M${x+5} ${y+h*.45} v${h*.3}`)}`;

    state.events = L.events||{}; state.shopping = L.shopping||{}; state.wishlist = L.wishlist||{}; if (L.settings) Object.assign(state.settings, L.settings);
    if (!window.claude?.use) { renderAll(); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch {}
    if (!db) { renderAll(); return; }
    this.db = db; state.mode = 'db'; state.events = {}; state.shopping = {}; state.wishlist = {};
    try { state.uid = user ? await user.id() : null; const cw = user ? await user.can('data.write') : null; if (cw===false) state.canWrite = false; } catch {}
    db.collection('events').onSnapshot(s => { const o={}; s.docs.forEach(d=>o[d.id]=d.data()); state.events=o; renderCal(); }, e => console.warn(e));
    db.collection('shopping').onSnapshot(s => { const o={}; s.docs.forEach(d=>o[d.id]=d.data()); state.shopping=o; renderShop(); }, e => console.warn(e));
    db.collection('wishlist').onSnapshot(s => { const o={}; s.docs.forEach(d=>o[d.id]=d.data()); state.wishlist=o; renderWish(); }, e => console.warn(e));
    db.doc('config/main').onSnapshot(s => { if (s.exists){ state.settings = {...state.settings, ...s.data()}; } renderHero(); renderCal(); renderShop(); renderWish(); renderFlock(); }, e => console.warn(e));
    renderAll();
  },
  saveLocal(){ ls.set('ovelhas.local',{events:state.events,shopping:state.shopping,wishlist:state.wishlist,settings:state.settings}); },
  async put(col, id, data){
    if (this.db){ try { await this.db.collection(col).doc(id).set(data); } catch(e){ fail(e); } }
    else { state[col][id] = data; this.saveLocal(); RENDER[col](); }
  },
  async del(col, id){
    if (this.db){ try { await this.db.collection(col).doc(id).delete(); } catch(e){ fail(e); } }
    else { delete state[col][id]; this.saveLocal(); RENDER[col](); }
  },
  async settings(data){
    state.settings = {...state.settings, ...data};
    if (this.db){ try { await this.db.doc('config/main').set(state.settings); } catch(e){ fail(e); } }
    else this.saveLocal();
    renderHero(); renderCal(); renderShop(); renderWish(); renderFlock();
  },
};

function puffBurst(el){
  const r = el.getBoundingClientRect(); if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  for (let i=0;i<9;i++){ const p=document.createElement('i'); p.className='puff'; p.style.left=(r.left+r.width/2)+'px'; p.style.top=(r.top+r.height/2)+'px';
    const a=Math.random()*Math.PI*2, d=30+Math.random()*30; p.style.setProperty('--dx',Math.cos(a)*d+'px'); p.style.setProperty('--dy',Math.sin(a)*d-20+'px');
    if (i%3===0) p.style.background='#FFB5CB'; document.body.append(p); setTimeout(()=>p.remove(),950); }
}

/* =========================================================
   Ocorrências (com repetição semanal / quinzenal)
   ========================================================= */
function occurrences(from, to){
  const F = iso(from), T = iso(to), out = {};
  const push = (k, id, ev) => (out[k] ||= []).push({id, ...ev, occ:k});
  for (const [id, ev] of Object.entries(state.events)){
    if (!ev?.date) continue;
    if (!ev.repeat || ev.repeat==='none'){ if (ev.date>=F && ev.date<=T) push(ev.date,id,ev); continue; }
    const step = ev.repeat==='biweekly'?14:7, until = ev.until || T; let d = parse(ev.date);
    if (iso(d) < F){ const diff = Math.floor((from - d)/864e5); d = addDays(d, Math.floor(diff/step)*step); }
    for (; iso(d) <= T && iso(d) <= until; d = addDays(d, step)){ const k = iso(d); if (k>=F && !(ev.exdates||[]).includes(k)) push(k,id,ev); }
  }
  for (const k in out) out[k].sort((a,b)=> (a.allDay?'':a.start||'99') < (b.allDay?'':b.start||'99') ? -1 : 1);
  return out;
}

  ele:['Compilou sem erros! ✓','Ovelha de Schrödinger: dormindo e acordada até alguém abrir a caixa','E = mc², com c = carinho','git commit -m "te amo"','Entropia do quarto: aumentando, como manda a 2ª lei','Bééé-a-bá da mecânica quântica','Você é meu ponto fixo','Nosso amor é O(1): constante','Emaranhados, mesmo a distância'],

function speak(g){
  document.querySelector('.bubble')?.remove();
  const hero = $('#hero'), r = g.getBoundingClientRect(), hr = hero.getBoundingClientRect(), w = g.dataset.who;
  const b = document.createElement('div'); b.className='bubble'; const list = PUNS[w]; b.textContent = list[Math.floor(Math.random()*list.length)];
  b.style.left = Math.min(Math.max(r.left - hr.left + r.width/2, 130), hr.width-130) + 'px'; b.style.top = (r.top - hr.top + 6) + 'px';
  hero.append(b); setTimeout(()=>b.remove(), 3000);
}

function renderCal(){
  renderFilters();
  const m = state.month, first = new Date(m.getFullYear(), m.getMonth(), 1), start = addDays(first, -first.getDay());
  const end = addDays(start, 41), occ = occurrences(start, end), tk = iso(today);
  $('#monthTitle').textContent = `${MESES[m.getMonth()]} ${m.getFullYear()}`;
  $('#dows').innerHTML = DOW.map((d,i)=>`<div class="dow${i===6?' sat':''}">${d}</div>`).join('');
  let html = '';
  for (let i=0;i<42;i++){
    const d = addDays(start,i), k = iso(d), hol = holidaysFor(d).filter(visibleHol), evs = (occ[k]||[]).filter(visible);
    const hasBr = hol.some(h=>h.kind==='br'), hasJ = hol.some(h=>h.kind==='jew' && !h.minor);
    const cls = ['day', d.getMonth()!==m.getMonth()&&'out', k===tk&&'today', k===state.sel&&'sel', hasBr&&'holiday', !hasBr&&hasJ&&'jholiday'].filter(Boolean).join(' ');
    const shown = evs.slice(0, 3);
    html += `<div class="${cls}" role="button" tabindex="0" data-day="${k}" aria-label="${d.getDate()} de ${MESES[d.getMonth()]}, ${evs.length} compromissos${hol.length?', '+hol.map(h=>h.name).join(', '):''}">
      <div class="top-row"><span class="num">${d.getDate()}</span>${d.getDay()===5?`<span class="candle-mini" title="Shabat Shalom!"><svg viewBox="-8 -14 16 30"><rect x="-3" y="0" width="6" height="14" rx="1.5" fill="currentColor" opacity=".35"/><path d="M0 -12 C4 -7 4 -2 0 -1 C-4 -2 -4 -7 0 -12Z" fill="currentColor"/></svg></span>`:''}</div>
      ${hol.slice(0,2).map(h=>`<div class="hol ${h.kind}${h.minor?' minor':''}" title="${esc(h.name)}">${esc(h.name)}</div>`).join('')}
      ${shown.map(e=>{ const c=colorOf(e.who,e.type); return `<button class="ev" data-ev="${e.id}" data-occ="${k}" style="--c:${c};--t:${textOn(c)};--w:${WHO_COLOR[e.who]}" title="${esc(e.title)}"><i class="who"></i>${!e.allDay&&e.start?`<span class="tm">${e.start}</span>`:''}<span>${esc(e.title)}</span></button>`; }).join('')}
      ${evs.length>3?`<span class="more">+${evs.length-3} mais</span>`:''}
      <div class="dots">${hol.filter(h=>!h.minor).slice(0,1).map(h=>`<i style="--c:${h.kind==='jew'?'var(--jew)':h.kind==='love'?'var(--ela)':'var(--br)'}"></i>`).join('')}${evs.slice(0,4).map(e=>`<i style="--c:${colorOf(e.who,e.type)}"></i>`).join('')}</div>
      ${k===tk?`<svg class="sticker" viewBox="-36 -38 80 80" aria-hidden="true">${sheep({who:state.me||'ela',body:false,cls:''})}</svg>`:''}
    </div>`;
  }
  $('#grid').innerHTML = html;
  renderDay(); renderUpcoming();
}

function evRow(e, showDate=false){
  const c = colorOf(e.who,e.type), t = TYPES.find(x=>x.k===e.type)||TYPES.at(-1), d = parse(e.occ);
  const when = (showDate ? `${DOW[d.getDay()]} ${d.getDate()}/${pad(d.getMonth()+1)} · ` : '') + (e.allDay||!e.start ? 'dia inteiro' : `${e.start}${e.end?'–'+e.end:''}`);
  return `<button class="item" data-ev="${e.id}" data-occ="${e.occ}">${miniSheep(e.who, e.type)}<span class="meta"><b>${esc(e.title)}</b><small><span class="mono">${when}</span>${e.location?' · '+esc(e.location):''}${e.repeat&&e.repeat!=='none'?' · repete':''}</small></span><span class="tag ticon" style="--c:${c};--t:${textOn(c)}" title="${t.n}">${icon(t.k,2.4)}</span></button>`;
}
function renderDay(){
  const d = parse(state.sel), k = state.sel, evs = (occurrences(d,d)[k]||[]).filter(visible), hol = holidaysFor(d);
  $('#dayPanel').innerHTML = `
    <div class="day-title"><div><div class="eyebrow">${DOW_FULL[d.getDay()]}</div><h2>${d.getDate()} de ${MESES[d.getMonth()]}</h2><div class="heb">${esc(hebLabel(d))}</div></div>
      <button class="btn small primary" id="addHere">+ Adicionar</button></div>
    ${hol.length?`<div class="list">${hol.map(h=>`<div class="hol ${h.kind}${h.minor?' minor':''}" style="font-size:12.5px;padding:5px 9px;white-space:normal">${esc(h.name)}</div>`).join('')}</div>`:''}
    ${d.getDay()===5||d.getDay()===6?`<div class="note">Shabat Shalom!</div>`:''}
    <div class="list">${evs.length ? evs.map(e=>evRow(e)).join('') : `<div class="empty"><svg viewBox="-100 -60 200 110" aria-hidden="true">${shadow(0,44,80)}${sheep({x:-38,y:42-BABY*.62,s:.62,who:'ela',mood:'sleep',flip:true,cls:''})}${sheep({x:40,y:42-ADULT*.66,s:.66,who:'ele',mood:'sleep',cls:''})}<text x="62" y="-40" font-family="Caveat, cursive" font-size="20" fill="#8E6CD8">z z z</text></svg>Dia livre no pasto. Toque em “+ Adicionar” para marcar algo.</div>`}</div>`;
}
function renderUpcoming(){
  const to = addDays(today, 21), occ = occurrences(today, to), rows = [];
  for (let d=new Date(today); d<=to; d=addDays(d,1)) (occ[iso(d)]||[]).filter(visible).forEach(e=>rows.push(e));
  const hol = []; for (let d=new Date(today); d<=addDays(today,45) && hol.length<4; d=addDays(d,1)) holidaysFor(d).filter(h=>!h.minor && visibleHol(h)).forEach(h=>hol.length<4 && hol.push({...h,d}));
  $('#upcoming').innerHTML = `<div><div class="eyebrow">Próximas 3 semanas</div><h3>Agenda do rebanho</h3></div>
    <div class="list">${rows.length ? rows.slice(0,8).map(e=>evRow(e,true)).join('') : `<div class="empty">Nada marcado ainda. Comece pelas aulas da semana: elas podem se repetir sozinhas.</div>`}</div>
    ${hol.length?`<div class="eyebrow">Datas que vêm aí</div><div class="list">${hol.map(h=>`<div class="item"><span class="hol ${h.kind}" style="font-size:11.5px">${h.kind==='jew'?'Judaico':h.kind==='love'?'Amor':h.kind==='sp'?'SP':'Feriado'}</span><span class="meta"><b>${esc(h.name)}</b><small class="mono">${DOW[h.d.getDay()]} ${h.d.getDate()}/${pad(h.d.getMonth()+1)}</small></span></div>`).join('')}</div>`:''}`;
}

/* ---------- modal de compromisso ---------- */
function openEvent(id=null, occ=null){
  if (!state.canWrite && !id) return toast('Você está só com acesso de leitura.');
  const ev = id ? {...state.events[id]} : {title:'', who: state.me||'juntos', type: 'aula', date: state.sel, allDay:false, start:'09:00', end:'10:00', repeat:'none', until:'', location:'', notes:''};
  let who = ev.who, type = ev.type;
  const ov = document.createElement('div'); ov.className='overlay';
  const draw = () => {
    ov.innerHTML = `<form class="modal" id="evForm" aria-label="${id?'Editar':'Novo'} compromisso">
      ${TYPE_SCENE[type] ? `<div class="modal-art">${sceneFor(TYPE_SCENE[type])}</div>` : ''}
      <div class="modal-head">${miniSheep(who, type).replace('mini-sheep','')}<div><div class="eyebrow">${id?'Editar compromisso':'Novo compromisso'}</div><h2>${id?esc(ev.title):'O que vamos anotar?'}</h2></div></div>
      <div class="field"><label for="f-title">Título</label><input class="inp" id="f-title" required maxlength="80" value="${esc(ev.title)}" placeholder="Ex.: Aula de Biomateriais, Cinema, Plantão de Física"></div>
      <div class="field"><span class="lbl">De quem é?</span><div class="who-pick" role="radiogroup">${['ela','ele','juntos'].map(w=>`<button type="button" class="who-opt" role="radio" data-w="${w}" aria-checked="${who===w}" style="--c:${WHO_COLOR[w]};--cs:${WHO_SOFT[w]}">${miniSheep(w).replace('class="mini-sheep"','')}${esc(nameOf(w))}</button>`).join('')}</div></div>
      <div class="field"><span class="lbl">Tipo</span><div class="type-pick" role="radiogroup">${TYPES.map(t=>{const c=colorOf(who,t.k);return `<button type="button" class="type-opt" role="radio" data-t="${t.k}" aria-checked="${type===t.k}" style="--c:${c}"><span class="ticon" style="--c:${c};--t:${textOn(c)}">${icon(t.k,2.4)}</span>${t.n}</button>`}).join('')}</div></div>
      <div class="row"><div class="field"><label for="f-date">Data</label><input class="inp" type="date" id="f-date" required value="${ev.date}"></div>
        <div class="field"><label for="f-start">Início</label><input class="inp" type="time" id="f-start" value="${ev.start||''}" ${ev.allDay?'disabled':''}></div>
        <div class="field"><label for="f-end">Fim</label><input class="inp" type="time" id="f-end" value="${ev.end||''}" ${ev.allDay?'disabled':''}></div></div>
      <label class="check"><input type="checkbox" id="f-allday" ${ev.allDay?'checked':''}> Dia inteiro</label>
      <div class="row"><div class="field"><label for="f-repeat">Repetir</label><select class="inp" id="f-repeat">
          <option value="none" ${ev.repeat==='none'||!ev.repeat?'selected':''}>Não repete</option><option value="weekly" ${ev.repeat==='weekly'?'selected':''}>Toda semana</option><option value="biweekly" ${ev.repeat==='biweekly'?'selected':''}>A cada 2 semanas</option></select></div>
        <div class="field"><label for="f-until">Até (fim do semestre)</label><input class="inp" type="date" id="f-until" value="${ev.until||''}"></div></div>
      <div class="field"><label for="f-loc">Local</label><input class="inp" id="f-loc" maxlength="80" value="${esc(ev.location)}" placeholder="Ex.: Einstein, Insper, IF-USP, Paulista"></div>
      <div class="field"><label for="f-notes">Notas</label><textarea class="inp" id="f-notes" maxlength="500" placeholder="Levar jaleco, trazer pipoca...">${esc(ev.notes)}</textarea></div>
      <div id="confirmBox"></div>
      <div class="modal-foot">${id?`<button type="button" class="btn danger" id="f-del">Excluir</button>`:''}<span class="grow"></span><button type="button" class="btn" id="f-cancel">Cancelar</button><button type="submit" class="btn primary">${id?'Salvar':'Adicionar'}</button></div>
    </form>`;
    const f = ov.querySelector('form');
    const keep = () => { ev.title=f.querySelector('#f-title').value; ev.date=f.querySelector('#f-date').value; ev.start=f.querySelector('#f-start').value; ev.end=f.querySelector('#f-end').value;
      ev.allDay=f.querySelector('#f-allday').checked; ev.repeat=f.querySelector('#f-repeat').value; ev.until=f.querySelector('#f-until').value; ev.location=f.querySelector('#f-loc').value; ev.notes=f.querySelector('#f-notes').value; };
    f.querySelectorAll('.who-opt').forEach(b=>b.onclick=()=>{ keep(); who=b.dataset.w; draw(); ov.querySelector(`[data-w="${who}"]`).focus(); });
    f.querySelectorAll('.type-opt').forEach(b=>b.onclick=()=>{ keep(); type=b.dataset.t; draw(); ov.querySelector(`[data-t="${type}"]`).focus(); });
    f.querySelector('#f-allday').onchange = e => { f.querySelector('#f-start').disabled = f.querySelector('#f-end').disabled = e.target.checked; };
    f.querySelector('#f-cancel').onclick = close;
    f.onsubmit = async e => { e.preventDefault(); keep(); if (!ev.title.trim()) return;
      const data = {...ev, title:ev.title.trim(), who, type, updatedAt:Date.now(), by: state.uid||null}; if (!id) data.createdAt = Date.now();
      if (data.allDay){ data.start=''; data.end=''; }
      close(); await store.put('events', id||newId(), data); state.sel = data.date; toast(id?'Compromisso atualizado':'Anotado no caderno do rebanho!'); renderCal(); };
    const del = f.querySelector('#f-del');
    if (del) del.onclick = () => {
      const rep = ev.repeat && ev.repeat!=='none';
      f.querySelector('#confirmBox').innerHTML = `<div class="confirm">${rep?'Este compromisso se repete. Excluir o quê?':'Excluir este compromisso?'}<div>
        ${rep&&occ?`<button type="button" class="btn small" id="c-one">Só ${parse(occ).getDate()}/${pad(parse(occ).getMonth()+1)}</button>`:''}<button type="button" class="btn small ela" id="c-all">${rep?'Todas as repetições':'Sim, excluir'}</button><button type="button" class="btn small" id="c-no">Manter</button></div></div>`;
      f.querySelector('#c-no').onclick = () => f.querySelector('#confirmBox').innerHTML='';
      f.querySelector('#c-all').onclick = async () => { close(); await store.del('events', id); toast('Compromisso excluído'); };
      const one = f.querySelector('#c-one'); if (one) one.onclick = async () => { close(); await store.put('events', id, {...state.events[id], exdates:[...(state.events[id].exdates||[]), occ]}); toast('Só esse dia foi removido'); };
    };
  };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key==='Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', e => { if (e.target===ov) close(); });
  draw(); document.body.append(ov); ov.querySelector('#f-title').focus();
}

/* ---------- compras ---------- */
let shopWho = null;
function renderShop(){
  const known = new Set(CATS.map(c=>c.k));
  const items = Object.entries(state.shopping).map(([id,v])=>({id,...v, cat: known.has(v.cat) ? v.cat : 'mercado'}));
  const pending = items.filter(i=>!i.done).length;
  $('#shopSummary').innerHTML = `<span class="mono">${pending}</span> ${pending===1?'item pendente':'itens pendentes'} · <span class="mono">${items.length-pending}</span> no carrinho`;
  $('#cats').innerHTML = CATS.map(c => { const n = items.filter(i=>i.cat===c.k && !i.done).length;
    return `<button class="cat" data-cat="${c.k}" aria-pressed="${state.cat===c.k}">${SCENES[c.k]()}<span class="cap"><b>${c.n}</b><span class="count${n?' has':''}">${n} ${n===1?'item':'itens'}</span></span></button>`; }).join('');
  const cat = CATS.find(c=>c.k===state.cat) || CATS[0];
  const list = items.filter(i=>i.cat===cat.k).sort((a,b)=> (a.done-b.done) || (a.createdAt||0)-(b.createdAt||0));
  shopWho ||= state.me || 'juntos';
  $('#catDetail').innerHTML = `<div class="art">${SCENES[cat.k]()}</div>
    <div class="body">
      <div class="day-title"><div><div class="eyebrow">Categoria</div><h2>${cat.n}</h2></div>${list.some(i=>i.done)?`<button class="btn small" id="clearDone">Limpar comprados</button>`:''}</div>
      <form class="add-row" id="addItem">
        <input class="inp" id="i-name" maxlength="60" placeholder="Adicionar em ${cat.n.toLowerCase()}..." aria-label="Item">
        <input class="inp" id="i-qty" maxlength="12" placeholder="qtd." aria-label="Quantidade">
        <div class="mine" role="radiogroup" aria-label="Para quem">${['ela','ele','juntos'].map(w=>`<button type="button" role="radio" data-sw="${w}" aria-checked="${shopWho===w}" aria-label="${esc(nameOf(w))}" title="${esc(nameOf(w))}" style="--c:${WHO_COLOR[w]};--cs:${WHO_SOFT[w]}">${miniSheep(w).replace('class="mini-sheep"','')}</button>`).join('')}</div>
        <button class="btn primary" type="submit">Pôr na lista</button>
      </form>
      <div class="list">${list.length ? list.map(i=>`<div class="sitem${i.done?' done':''}"><input type="checkbox" id="chk-${i.id}" data-chk="${i.id}" ${i.done?'checked':''} aria-label="Comprado: ${esc(i.name)}">
        ${miniSheep(i.who||'juntos').replace('class="mini-sheep"','class="ws"')}<label class="nm" for="chk-${i.id}">${esc(i.name)}</label><span class="qty">${esc(i.qty||'')}</span><button class="x" data-delitem="${i.id}" aria-label="Remover ${esc(i.name)}">✕</button></div>`).join('')
        : `<div class="empty">Nada por aqui ainda. Escreva o primeiro item acima e escolha de qual ovelha ele é.</div>`}</div>
    </div>`;
  $('#addItem').onsubmit = async e => { e.preventDefault(); const name = $('#i-name').value.trim(); if (!name) return;
    if (!state.canWrite) return toast('Você está só com acesso de leitura.');
    const qty = $('#i-qty').value.trim(); $('#i-name').value=''; $('#i-qty').value='';
    await store.put('shopping', newId(), {name, qty, cat:cat.k, who:shopWho, done:false, createdAt:Date.now(), by:state.uid||null}); $('#i-name')?.focus(); };
  document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{ shopWho=b.dataset.sw; document.querySelectorAll('[data-sw]').forEach(x=>x.setAttribute('aria-checked', x===b)); });
  const cd = $('#clearDone'); if (cd) cd.onclick = async () => { for (const i of list.filter(i=>i.done)) await store.del('shopping', i.id); toast('Carrinho esvaziado'); };
}

let wishPrio = 2;
const safeLink = u => { try { const x = new URL(u.trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const hearts = n => `<span class="hearts" aria-label="Prioridade ${n} de 3">${[1,2,3].map(i=>`<svg viewBox="0 0 24 24" class="${i>n?'off':''}" fill="currentColor" aria-hidden="true">${I.encontro}</svg>`).join('')}</span>`;
function renderWish(){
  const s = state.settings, isDov = state.me === 'ele';
  $('#wishTop').innerHTML = wishScene() + `<div class="ttl"><span class="eyebrow">Lista de desejos</span><h2>Wishlist da ${esc(s.nameEla)}</h2><span>Pedidos da ovelha bebê, do mais sonhado ao “seria fofo”.</span></div>`;
  $('#wishForm').innerHTML = `<div><div class="eyebrow">Novo desejo</div><h3>O que a ovelha bebê quer?</h3></div>
    <div class="field"><label for="w-name">Desejo</label><input class="inp" id="w-name" maxlength="80" required placeholder="Ex.: Livro de biomecânica, pantufa de ovelha"></div>
    <div class="field"><label for="w-price">Preço (aprox.)</label><input class="inp" id="w-price" maxlength="20" placeholder="R$ 120"></div>
    <div class="field"><span class="lbl">Quanto quero</span><div class="prio-pick" role="radiogroup">${[1,2,3].map(n=>`<button type="button" role="radio" data-prio="${n}" aria-checked="${wishPrio===n}" aria-label="${n} de 3">${Array.from({length:n},()=>`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${I.encontro}</svg>`).join('')}</button>`).join('')}</div></div>
    <div class="field"><label for="w-link">Link da loja</label><input class="inp" id="w-link" maxlength="400" inputmode="url" placeholder="https://..."></div>
    <div class="field"><label for="w-note">Detalhes</label><textarea class="inp" id="w-note" maxlength="300" placeholder="Tamanho, cor, qual edição..."></textarea></div>
    <button class="btn ela" type="submit">Pôr na wishlist</button>
    ${isDov ? `<div class="note">Modo ${esc(s.nameEle)}: o botão “Vou dar” marca um presente em segredo. Essa marcação não aparece para a ${esc(s.nameEla)} neste app.</div>` : ''}`;
  const all = Object.entries(state.wishlist).map(([id,v])=>({id,...v}));
  const open = all.filter(w=>!w.got).sort((a,b)=>(b.prio||0)-(a.prio||0) || (a.createdAt||0)-(b.createdAt||0)), got = all.filter(w=>w.got);
  const card = w => { const link = safeLink(w.link||'');
    return `<article class="wcard${w.got?' got':''}">
      <div class="day-title">${hearts(w.prio||1)}${w.price?`<span class="price">${esc(w.price)}</span>`:''}</div>
      <h3>${esc(w.name)}</h3>${w.note?`<p>${esc(w.note)}</p>`:''}
      ${isDov && w.reserved && !w.got ? `<span class="secret">Reservado por você (segredo)</span>` : ''}
      <div class="acts">${link?`<a class="btn small" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Ver na loja</a>`:''}
        <button class="btn small" data-wgot="${w.id}">${w.got?'Voltar pra lista':'Ganhei!'}</button>
        ${isDov && !w.got ? `<button class="btn small" data-wres="${w.id}">${w.reserved?'Desmarcar':'Vou dar'}</button>` : ''}
        <button class="btn small danger" data-wdel="${w.id}" aria-label="Remover ${esc(w.name)}">Remover</button></div>
    </article>`; };
  $('#wishList').innerHTML = (open.length ? open.map(card).join('') : `<div class="panel empty" style="grid-column:1/-1;padding:24px"><svg viewBox="-70 -60 140 110" aria-hidden="true">${sheep({who:'ela',flip:true,mood:'happy-closed',cls:''})}</svg>A wishlist está vazia. Escreva o primeiro desejo ao lado.</div>`)
    + (got.length ? `<div style="grid-column:1/-1" class="eyebrow">Já ganhei</div>` + got.map(card).join('') : '');
  $('#wishForm').onsubmit = async e => { e.preventDefault(); const name = $('#w-name').value.trim(); if (!name) return;
    if (!state.canWrite) return toast('Você está só com acesso de leitura.');
    const data = {name, price:$('#w-price').value.trim(), link:$('#w-link').value.trim(), note:$('#w-note').value.trim(), prio:wishPrio, got:false, reserved:false, createdAt:Date.now(), by:state.uid||null};
    await store.put('wishlist', newId(), data); toast('Desejo anotado!'); };
  document.querySelectorAll('[data-prio]').forEach(b=>b.onclick=()=>{ wishPrio=+b.dataset.prio; document.querySelectorAll('[data-prio]').forEach(x=>x.setAttribute('aria-checked', x===b)); });
}

/* ---------- rebanho (configurações + convite) ---------- */
function renderFlock(){
  const s = state.settings;
  $('#view-flock').innerHTML = `
    <div class="panel"><div class="eyebrow">Quem está usando este aparelho?</div><h2>Qual ovelhinha é você?</h2>
      <div class="who-pick" role="radiogroup" style="grid-template-columns:1fr 1fr">${['ela','ele'].map(w=>`<button class="who-opt" role="radio" data-me="${w}" aria-checked="${state.me===w}" style="--c:${WHO_COLOR[w]};--cs:${WHO_SOFT[w]}">${miniSheep(w).replace('class="mini-sheep"','')}${esc(nameOf(w))}</button>`).join('')}</div>
      <p class="muted" style="margin:0;font-size:13.5px">Isso define o padrão dos novos compromissos e da lista de compras neste aparelho.</p>
      <div class="row"><div class="field"><label for="n-ela">Nome da ovelha bebê</label><input class="inp" id="n-ela" maxlength="24" value="${esc(s.nameEla)}"></div>
        <div class="field"><label for="n-ele">Nome da outra ovelha</label><input class="inp" id="n-ele" maxlength="24" value="${esc(s.nameEle)}"></div></div>
      <div><button class="btn primary" id="saveNames">Salvar nomes</button></div>
    </div>
    <div class="panel"><div class="eyebrow">Convite para o rebanho</div><h2>Chame o ${esc(s.nameEle)}</h2>
      <svg viewBox="0 0 320 120" aria-hidden="true" style="width:100%;height:auto;border-radius:16px;background:var(--sky)"><path d="M0 100 C80 86 240 96 320 88 V120 H0Z" fill="var(--hill)"/>${sheep({x:100,y:104-BABY*.55,s:.55,who:'ela',flip:true})}<g transform="translate(150 40)"><rect width="56" height="38" rx="6" fill="#fff" stroke="#E0528A" stroke-width="2.5"/><path d="M0 4 L28 24 L56 4" fill="none" stroke="#E0528A" stroke-width="2.5"/>${heart(28,16,1.1)}</g>${sheep({x:250,y:106-ADULT*.6,s:.6,who:'ele',mood:'o'})}</svg>
      <ol class="steps"><li>Abra o menu <b>Compartilhar</b> deste artifact no Claude (canto superior).</li><li>Convide o e-mail do ${esc(s.nameEle)} com a permissão <b>Editor</b>, assim ele pode adicionar e editar compromissos, compras e a wishlist.</li><li>Não ative o link público: com link público aberto, convidados de fora deixam de poder editar.</li><li>Quando ele abrir, é só ir em <b>Nosso rebanho</b> e escolher a ovelha dele.</li></ol>
      <div class="note">${state.mode==='db' ? (state.canWrite ? 'Tudo que vocês anotam aqui é salvo e sincronizado ao vivo entre os dois.' : 'Você está com acesso de leitura. Peça para ser convidado como Editor para poder anotar.') : 'Modo local: os dados estão só neste navegador. Abra pelo link do Claude para sincronizar entre vocês dois.'}</div>
    </div>
    ${['ela','ele','juntos'].map(w=>`<div class="panel"><div class="eyebrow">Paleta</div><div class="day-title"><h2 style="color:${WHO_COLOR[w]}">${w==='juntos'?'Paleta do casal':'Paleta de '+esc(nameOf(w))}</h2>${miniSheep(w)}</div>
      <div class="pal">${TYPES.map(t=>`<label class="sw"><input type="color" data-pal="${w}" data-pt="${t.k}" value="${colorOf(w,t.k)}" aria-label="Cor de ${t.n} na paleta ${nameOf(w)}">${t.n}</label>`).join('')}</div>
      <div><button class="btn small" data-savepal="${w}">Salvar paleta</button> <button class="btn small" data-resetpal="${w}">Voltar ao padrão</button></div></div>`).join('')}`;
  document.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{ state.me=b.dataset.me; ls.set('ovelhas.me',state.me); shopWho=state.me; renderFlock(); renderCal(); renderShop(); renderWish(); toast(`Oi, ${nameOf(state.me)}! Bééé!`); });
  $('#saveNames').onclick = () => store.settings({nameEla: $('#n-ela').value.trim()||'Ela', nameEle: $('#n-ele').value.trim()||'Ele'}).then(()=>toast('Nomes salvos'));
  document.querySelectorAll('[data-savepal]').forEach(b=>b.onclick=()=>{ const w=b.dataset.savepal, p={}; document.querySelectorAll(`[data-pal="${w}"]`).forEach(i=>p[i.dataset.pt]=i.value.toUpperCase());
    store.settings({palettes:{...(state.settings.palettes||{}), [w]:p}}).then(()=>toast('Paleta salva')); });
  document.querySelectorAll('[data-resetpal]').forEach(b=>b.onclick=()=>{ const P={...(state.settings.palettes||{})}; delete P[b.dataset.resetpal]; store.settings({palettes:P}).then(()=>toast('Paleta original de volta')); });
}

/* ---------- navegação ---------- */
function setView(v){
  state.view = v; ls.set('ovelhas.view', v);
  ['cal','shop','wish','flock'].forEach(k => { $('#view-'+k).hidden = k!==v; $('#tab-'+k).setAttribute('aria-selected', k===v); });
}
function renderAll(){ renderHero(); renderShabat(); renderCal(); renderShop(); renderWish(); renderFlock(); setView(state.view); }

document.body.insertAdjacentHTML('afterbegin', ART_DEFS);

    <g fill="#FFFFFF" fill-opacity=".14" font-family="Caveat, 'Segoe Print', cursive">${T.map(([t,x,y,r,z])=>`<text x="${x}" y="${y}" font-size="${z}" transform="rotate(${r} ${x} ${y})">${t}</text>`).join('')}</g>
    <g fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="rgba(255,255,255,.14)">${D.join('')}</g>
  </pattern></defs><rect width="100%" height="100%" fill="url(#chalkTile)"/>`; }
$('#tab-cal').innerHTML = icon('cal') + 'Calendário';
$('#tab-shop').innerHTML = icon('cart') + 'Compras';
$('#tab-wish').innerHTML = icon('gift') + 'Wishlist';
$('#tab-flock').innerHTML = icon('flock') + 'Nosso rebanho';
$('#prev').innerHTML = icon('left',2.6); $('#next').innerHTML = icon('right',2.6);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.view));
$('#prev').onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth()-1, 1); renderCal(); };
$('#next').onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth()+1, 1); renderCal(); };
$('#todayBtn').onclick = () => { state.month = new Date(today.getFullYear(), today.getMonth(), 1); state.sel = iso(today); renderCal(); };
$('#addBtn').onclick = () => openEvent();
document.addEventListener('click', e => {
  const t = e.target;
  const ev = t.closest('[data-ev]'); if (ev){ e.stopPropagation(); return openEvent(ev.dataset.ev, ev.dataset.occ); }
  const day = t.closest('[data-day]'); if (day){ state.sel = day.dataset.day; const d = parse(state.sel); if (d.getMonth()!==state.month.getMonth()) state.month = new Date(d.getFullYear(), d.getMonth(), 1); renderCal(); if (innerWidth<=980) $('#dayPanel').scrollIntoView({behavior:'smooth',block:'nearest'}); return; }
  if (t.closest('#addHere')) return openEvent();
  const w = t.closest('[data-who]:not(.sheep-hit)'); if (w){ state.whoFilter[w.dataset.who] = state.whoFilter[w.dataset.who]===false; ls.set('ovelhas.who', state.whoFilter); return renderCal(); }
  const ty = t.closest('[data-type]'); if (ty){ state.typeFilter[ty.dataset.type] = state.typeFilter[ty.dataset.type]===false; ls.set('ovelhas.types', state.typeFilter); return renderCal(); }
  const ho = t.closest('[data-hol]'); if (ho){ state.holFilter[ho.dataset.hol] = state.holFilter[ho.dataset.hol]===false; ls.set('ovelhas.hol', state.holFilter); return renderCal(); }
  const c = t.closest('[data-cat]'); if (c){ state.cat = c.dataset.cat; ls.set('ovelhas.cat', state.cat); renderShop(); $('#catDetail').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const di = t.closest('[data-delitem]'); if (di){ store.del('shopping', di.dataset.delitem); return; }
  const wg = t.closest('[data-wgot]'); if (wg){ const w = state.wishlist[wg.dataset.wgot]; if (w){ if (!w.got) puffBurst(wg); store.put('wishlist', wg.dataset.wgot, {...w, got:!w.got}); if (!w.got) toast('Eba! Mais um desejo realizado'); } return; }
  const wr = t.closest('[data-wres]'); if (wr){ const w = state.wishlist[wr.dataset.wres]; if (w) store.put('wishlist', wr.dataset.wres, {...w, reserved:!w.reserved}); return; }
  const wd = t.closest('[data-wdel]'); if (wd){ store.del('wishlist', wd.dataset.wdel); return; }
});
document.addEventListener('keydown', e => { const day = e.target.closest?.('[data-day]'); if (day && (e.key==='Enter'||e.key===' ') && e.target===day){ e.preventDefault(); day.click(); } });
document.addEventListener('change', e => { const id = e.target.dataset?.chk; if (!id) return; const it = state.shopping[id]; if (!it) return;
  if (e.target.checked) puffBurst(e.target); store.put('shopping', id, {...it, done:e.target.checked}); });

renderAll();
store.init();
</script>
